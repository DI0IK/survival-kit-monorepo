[project]
name = "survival-kit"
revision = "1.0"
require_reason = false

[profiles.default]
JWT_SECRET = { description = "Secret key for signing and verifying JWT tokens (HMAC-SHA)", required = true }
JWT_EXPIRATION = { description = "JWT token expiration in milliseconds", required = true }
POSTGRES_NAME = { description = "PostgreSQL database name", required = true }
POSTGRES_USER = { description = "PostgreSQL user", required = true }
POSTGRES_PASSWORD = { description = "PostgreSQL password", required = true }
REDIS_PASSWORD = { description = "Redis password", required = false }
MAIL_HOST = { description = "SMTP host", required = false }
MAIL_PORT = { description = "SMTP port", required = false }
MAIL_USERNAME = { description = "SMTP user", required = false }
MAIL_PASSWORD = { description = "SMTP password", required = false }
